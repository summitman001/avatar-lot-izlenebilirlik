        severity: { enum: [info, warning, critical] }
        ref_type: { enum: [production_order, cutting_order, purchase_receipt, sales_line] }
        ref_id: { $ref: "#/components/schemas/Id" }
        ref_no: { type: [string, "null"], description: "Ilgili siparis/belge numarasi (order_no/doc_no)" }
        message: { type: string, description: "Turkce, sayisal kanit icerir" }
        evidence: { type: object, additionalProperties: { type: string }, description: "ML'den/kural kontrolunden gelen sayisal kanit (Decimal-guvenli, yalniz string)" }
