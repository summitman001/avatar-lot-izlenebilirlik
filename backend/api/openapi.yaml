        affected_lots: { type: array, items: { $ref: "#/components/schemas/RecallLot" }, description: "Yalniz GET /recalls/{id}" }
        customers: { type: array, items: { $ref: "#/components/schemas/RecallCustomer" }, description: "Yalniz GET /recalls/{id}" }
    RecallList: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Recall" } } } }

