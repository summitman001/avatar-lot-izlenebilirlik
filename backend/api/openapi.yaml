        planned_qty: { $ref: "#/components/schemas/Qty" }
        received_qty: { oneOf: [{ $ref: "#/components/schemas/Qty" }, { type: "null" }] }
        service_unit_price: { $ref: "#/components/schemas/Amount" }
        service_invoice_no: { type: [string, "null"] }
        service_invoiced_qty: { oneOf: [{ $ref: "#/components/schemas/Qty" }, { type: "null" }] }
        status: { $ref: "#/components/schemas/ProductionOrderStatus" }
        output_lot_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        output_lot_no: { type: [string, "null"] }
        material_cost: { oneOf: [{ $ref: "#/components/schemas/Amount" }, { type: "null" }] }
        service_cost: { oneOf: [{ $ref: "#/components/schemas/Amount" }, { type: "null" }] }
        total_cost: { oneOf: [{ $ref: "#/components/schemas/Amount" }, { type: "null" }] }
        ekp_unit: { oneOf: [{ $ref: "#/components/schemas/Amount" }, { type: "null" }] }
        sale_price: { oneOf: [{ $ref: "#/components/schemas/Amount" }, { type: "null" }] }
        closed_at: { oneOf: [{ $ref: "#/components/schemas/DateTime" }, { type: "null" }] }
        created_at: { $ref: "#/components/schemas/DateTime" }
        warnings: { type: array, items: { enum: [INVOICED_QTY_MISMATCH, QTY_VARIANCE] } }
        inputs: { type: array, items: { $ref: "#/components/schemas/ProductionInputLine" }, description: "Yalniz GET /production-orders/{id}" }
        status_history: { type: array, items: { $ref: "#/components/schemas/ProductionStatusEvent" }, description: "Yalniz GET /production-orders/{id}" }
        prediction: { oneOf: [{ $ref: "#/components/schemas/ProductionPrediction" }, { type: "null" }], description: "Yalniz GET /production-orders/{id}" }
    ProductionOrderList: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ProductionOrder" } } } }
    CostReportLine:
      type: object
      properties:
        label: { type: string }
        qty: { oneOf: [{ $ref: "#/components/schemas/Qty" }, { type: "null" }] }
        unit_price: { oneOf: [{ $ref: "#/components/schemas/Amount" }, { type: "null" }] }
        amount: { type: string, description: "2 ondalik tutar" }
    ProductionCostReport:
      type: object
      description: "Dokumandaki tabloya karsilik gelir (Maliyet unsuru | miktar | birim fiyat | tutar)"
      properties:
        order_no: { type: string }
        status: { $ref: "#/components/schemas/ProductionOrderStatus" }
        lines: { type: array, items: { $ref: "#/components/schemas/CostReportLine" } }
        material_cost: { type: string }
        service_cost: { type: string }
        total_cost: { type: string }
        planned_qty: { $ref: "#/components/schemas/Qty" }
        received_qty: { $ref: "#/components/schemas/Qty" }
        invoiced_qty: { $ref: "#/components/schemas/Qty" }
        qty_variance_pct: { type: string, description: "|received-planned|/planned x 100, 2 ondalik" }
        ekp_unit: { type: string, description: "4 ondalik; degerleme bu alan veya total_cost uzerinden yapilir" }
        ekp_display: { type: string, description: "2 ondalik; YALNIZCA gosterim, degerleme icin kullanilmaz" }
        ekp_per_kg: { oneOf: [{ type: string }, { type: "null" }] }
        unit_weight_kg: { oneOf: [{ $ref: "#/components/schemas/Qty" }, { type: "null" }] }
        output_kg: { oneOf: [{ $ref: "#/components/schemas/Qty" }, { type: "null" }] }
        input_kg_total: { $ref: "#/components/schemas/Qty" }
        yield_input_pct: { oneOf: [{ type: string }, { type: "null" }] }
        yield_meat_ratio: { oneOf: [{ type: string }, { type: "null" }] }
        sale_price: { oneOf: [{ $ref: "#/components/schemas/Amount" }, { type: "null" }] }
        revenue: { oneOf: [{ type: string }, { type: "null" }] }
        gross_profit_unit: { oneOf: [{ type: string }, { type: "null" }] }
        gross_profit_total: { oneOf: [{ type: string }, { type: "null" }] }
        margin_pct: { oneOf: [{ type: string }, { type: "null" }] }
        warnings: { type: array, items: { enum: [INVOICED_QTY_MISMATCH, QTY_VARIANCE] } }
        prediction: { oneOf: [{ $ref: "#/components/schemas/ProductionPrediction" }, { type: "null" }] }
