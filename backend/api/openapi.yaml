        item_name: { type: string }
        depth: { type: integer }
        path: { type: string }
        status: { $ref: "#/components/schemas/LotStatus" }
    RecallCustomer:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Id" }
        customer_id: { $ref: "#/components/schemas/Id" }
        customer_name: { type: string }
        customer_phone: { type: [string, "null"] }
        customer_email: { type: [string, "null"] }
        lot_id: { $ref: "#/components/schemas/Id" }
        lot_no: { type: string }
        qty_shipped: { $ref: "#/components/schemas/Qty" }
        qty_returned: { $ref: "#/components/schemas/Qty" }
