name: CI

on:
  push:
  pull_request:

jobs:
  ml-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            ml/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Golden files are up to date
        run: |
          python -m oracle.cli --out "${RUNNER_TEMP}/golden"
          diff -r "${RUNNER_TEMP}/golden" ../docs/golden
      - name: Run tests
        run: pytest

  ml-docker-build:
    runs-on: ubuntu-latest
    needs: ml-test
    steps:
      - uses: actions/checkout@v4
      - name: Build ML image
        run: docker build -t avatar-ml ml/
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name avatar-ml avatar-ml
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/models
          docker rm -f avatar-ml
