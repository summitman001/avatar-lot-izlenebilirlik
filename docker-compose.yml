# Tek komutla kurulum: docker compose up --build
# Sira: mysql (healthy) -> migrate (bir kere) -> seed (bir kere) -> api -> web. ml bagimsiz.
# Tum degiskenlerin varsayilani var; .env gerekmez (bkz. .env.example).

name: avatar

x-db-env: &db-env
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: ${MYSQL_DATABASE:-avatar}
  DB_USER: ${MYSQL_USER:-app}
  DB_PASSWORD: ${MYSQL_PASSWORD:-app}

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      # Migration trigger olusturur; binlog acikken SUPER yetkisi gerekmesin (uygulama kullanicisi SUPER degildir).
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-avatar}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
      MYSQL_TEST_DATABASE: ${MYSQL_TEST_DATABASE:-avatar_test}
    ports:
      # Testler ve DB istemcileri icin hosta acik. Cakisirsa .env icinde MYSQL_HOST_PORT degistirin.
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Yalnizca bos volume'da calisir: test veritabanini olusturur (make reset ile yeniden kurulur).
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-app}@tcp(mysql:3306)/${MYSQL_DATABASE:-avatar}?multiStatements=true
      - up
    restart: "no"

  # Test veritabanini (yoksa) olusturur; mevcut volume'larda init betigi tekrar calismadigi icin
  # `make test-backend` bunu cagirir. Elle: docker compose run --rm test-db
  test-db:
    image: mysql:8.4
    profiles: ["tools"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:-root}
    entrypoint: ["mysql", "-hmysql", "-uroot"]
    command:
      - -e
      - >-
        CREATE DATABASE IF NOT EXISTS `${MYSQL_TEST_DATABASE:-avatar_test}` CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
        GRANT ALL PRIVILEGES ON `${MYSQL_TEST_DATABASE:-avatar_test}`.* TO '${MYSQL_USER:-app}'@'%';
    restart: "no"

  seed:
    build:
      context: ./backend
      target: seed
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Zorunlu degil (ML en iyi gayret'tir): URT-2026-045 seed senaryosunun tahmini olsun diye
      # bekleniyor. ml gec kalirsa/kapaliysa seed yine basarili olur, prediction bos kalir.
      ml:
        condition: service_healthy
    environment:
      <<: *db-env
      GOLDEN_DIR: /golden
      ML_URL: http://ml:8000
    volumes:
      # Kuzu recetesi docs/golden/cutting_case.json dosyasindan okunur.
      - ./docs/golden:/golden:ro
    restart: "no"

  api:
    build:
      context: ./backend
      target: api
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      HTTP_ADDR: ":8080"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ML_URL: http://ml:8000
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    build:
      context: ./web
      args:
        # Tarayici API'ye hosttan baglanir; build aninda gomulur.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"

  ml:
    build:
      context: ./ml
    ports:
      - "${ML_PORT:-8000}:8000"

volumes:
  mysql_data:
